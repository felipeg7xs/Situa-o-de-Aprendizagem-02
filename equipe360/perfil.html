<!DOCTYPE html>
<!--

  Nome do arquivo: perfil.html

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil - Equipe360</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-interna="true">
  <nav class="navbar navbar-expand-md navbar-sistema" aria-label="Navegação principal">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 text-white fw-bold" href="perfil.html">
        <img src="img/logo.svg" alt="" width="32" height="32"> Equipe360
      </a>
      <button class="navbar-toggler border-light" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon" style="filter: invert(1)"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="perfil.html">Meu perfil</a></li>
          <li class="nav-item"><a class="nav-link" href="consulta.html">Consultar colaboradores</a></li>
        </ul>
        <button id="btn-sair" type="button" class="btn btn-outline-light btn-sm">Sair</button>
      </div>
    </div>
  </nav>
  <main class="container py-4 py-md-5">
    <h1 class="h3 fw-bold mb-4">Meu perfil</h1>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="row g-4 align-items-center">
          <div class="col-12 col-md-3 text-center">
            <picture>
              <source type="image/webp" srcset="img/avatar-160.webp 160w, img/avatar-320.webp 320w" sizes="140px">
              <img src="img/avatar-160.jpg" srcset="img/avatar-160.jpg 160w, img/avatar-320.jpg 320w" sizes="140px" alt="Foto do usuário" class="avatar" width="140" height="140" decoding="async">
            </picture>
          </div>
          <div class="col-12 col-md-9">
            <h2 class="h4 fw-bold mb-1" data-perfil="nome"></h2>
            <p class="text-secondary mb-4" data-perfil="cargo"></p>
            <dl class="perfil-dados row mb-0">
              <div class="col-sm-6"><dt>E-mail</dt><dd data-perfil="email"></dd></div>
              <div class="col-sm-6"><dt>Telefone</dt><dd data-perfil="telefone"></dd></div>
              <div class="col-sm-6"><dt>Departamento</dt><dd data-perfil="departamento"></dd></div>
              <div class="col-sm-6"><dt>Data de admissão</dt><dd data-perfil="admissao"></dd></div>
            </dl>
          </div>
        </div>
      </div>
    </div>
    <a href="consulta.html" class="btn btn-primario mt-4">Consultar colaboradores</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
